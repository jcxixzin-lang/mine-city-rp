name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'electron/**'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:exe
      - uses: actions/upload-artifact@v4
        with:
          name: Mine-City-RP-Windows
          path: dist/*.exe